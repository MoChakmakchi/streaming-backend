services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: teton
      POSTGRES_USER: teton
      POSTGRES_PASSWORD: teton
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teton -d teton"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    environment:
      DATABASE_URL: postgres://teton:teton@postgres:5432/teton?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.worker
    environment:
      DATABASE_URL: postgres://teton:teton@postgres:5432/teton?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
